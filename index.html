<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey APP - Video Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background-color: #000;
            font-family: 'Courier New', Courier, monospace; color: #0f0;
            height: 100vh; width: 100vw; }
        #matrix-canvas { position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        #chat-window { position: relative; z-index: 10;
            width: 100vw; height: 100vh; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; gap: 15px; }
        #video-embed { position: relative; width: 100%; max-width: 640px;
            background: rgba(0, 20, 0, 0.9); border: 3px solid #0f0;
            border-radius: 12px; overflow: hidden; box-shadow: 0 0 40px rgba(0,255,0,0.5);
            aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; }
        #video-embed video { width: 100%; height: 100%;
            object-fit: cover; transform: scaleX(-1); }
        #video-embed .empty-state { color: #0a0; font-size: 1.2rem;
            text-align: center; padding: 40px; border: 2px dashed #0f0; }
        #cam-status { position: absolute; top: 12px; right: 12px;
            padding: 6px 14px; background: rgba(0,0,0,0.7);
            border: 1px solid #0f0; color: #0f0; font-size: 0.8rem;
            border-radius: 20px; animation: blink 1s infinite; }
        #connect-info { position: absolute; top: 12px; left: 12px;
            padding: 6px 14px; background: rgba(0,0,0,0.7);
            border: 1px solid #0f0; color: #0f0; font-size: 0.8rem;
            border-radius: 20px; }
        @keyframes blink { 0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; } }
#controls-panel { position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%); z-index: 100;
    background: rgba(0, 30, 0, 0.95); border: 2px solid #0f0;
    border-radius: 50px; padding: 14px 32px; display: flex; gap: 16px;
    align-items: center; box-shadow: 0 0 40px rgba(0,255,0,0.4);
    backdrop-filter: blur(6px); }
    .control-btn { background: transparent; border: 1px solid #0f0;
        color: #0f0; padding: 10px 22px;
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.85rem; cursor: pointer; border-radius: 6px;
        transition: all 0.2s ease; text-transform: uppercase;
        letter-spacing: 1px; }
    .control-btn:hover { background: #0f0; color: #000;
        box-shadow: 0 0 20px #0f0; }
    .control-btn:active { transform: scale(0.95); }
    .control-btn.active { background: #0f0; color: #000; }
    .control-btn.secondary { border-color: #0ff; color: #0ff; }
    .control-btn.secondary:hover { background: #0ff; color: #000; }
    .control-btn.danger { border-color: #f00; color: #f00; }
    .control-btn.danger:hover { background: #f00; color: #000; }
#status-indicator { position: fixed; top: 20px; left: 20px; z-index: 100;
    background: rgba(0, 30, 0, 0.9); border: 1px solid #0f0;
    padding: 10px 16px; border-radius: 6px; font-size: 0.85rem;
    display: flex; align-items: center; gap: 10px; }
    .status-dot { width: 10px; height: 10px; background: #0f0;
        border-radius: 50%; animation: blink 1s infinite;
        box-shadow: 0 0 12px #0f0; }
#header { position: fixed; top: 20px; right: 20px; z-index: 100;
    text-align: right; }
    #header h1 { color: #0f0; font-size: 1.4rem;
        text-transform: uppercase; letter-spacing: 3px;
        text-shadow: 0 0 12px #0f0; margin-bottom: 6px; }
    #header p { color: #0a0; font-size: 0.8rem; letter-spacing: 1px; }
#scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 5; pointer-events: none;
    background: linear-gradient(to bottom,
        rgba(255,255,255,0), rgba(255,255,255,0) 50%,
        rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
    background-size: 100% 4px; }
#vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 5; pointer-events: none;
    background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.8) 100%); }
@keyframes crt-flicker { 0% { opacity: 0.97; }
    50% { opacity: 1; } 100% { opacity: 0.98; } }
#crt-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 6; background: rgba(0,0,0,0.1);
    animation: crt-flicker 0.15s infinite; pointer-events: none; }
@media (max-width: 768px) {
    #video-embed { max-width: 100%; }
    #controls-panel { bottom: 15px; padding: 10px 20px; gap: 10px; }
    .control-btn { padding: 8px 16px; font-size: 0.8rem; }
    #header { top: 10px; right: 10px; }
    #header h1 { font-size: 1.1rem; }
}
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>
    <div id="scanlines"></div>
    <div id="vignette"></div>
    <div id="crt-overlay"></div>

    <div id="header">
        <h1>Monkey APP</h1>
        <p>Video Chat Connect</p>
    </div>

    <div id="status-indicator">
        <div class="status-dot"></div>
        <span id="status-text">Disconnected</span>
    </div>

    <div id="chat-window">
        <div id="video-embed">
            <div id="cam-status">CAM OFF</div>
            <div id="connect-info">DISCONNECTED</div>
            <div class="empty-state">Connect to start video chat</div>
            <video id="chat-video" autoplay playsinline muted></video>
        </div>
    </div>

    <div id="controls-panel">
        <button class="control-btn danger" id="btn-connect" onclick="toggleConnect()">Connect</button>
        <button class="control-btn secondary" id="btn-switch-cam" onclick="switchCamera()" disabled>Switch Camera</button>
        <button class="control-btn" id="btn-matrix" onclick="toggleMatrix()">Matrix: ON</button>
    </div>

    <script>
        // ==================== MATRIX BACKGROUND ====================
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        let canvasWidth, canvasHeight, fontSize = 14, columns, drops = [];
        let matrixActive = true;
        const matrixChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%+-/~{[|`]}";

        function resizeCanvas() {
            canvasWidth = canvas.width = window.innerWidth;
            canvasHeight = canvas.height = window.innerHeight;
            columns = canvasWidth / fontSize;
            drops = [];
            for (let i = 0; i < columns; i++) { drops[i] = Math.random() * canvasHeight / fontSize; }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawMatrix() {
            if (!matrixActive) return;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            ctx.fillStyle = '#0f0';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = matrixChars.charAt(Math.floor(Math.random() * matrixChars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvasHeight && Math.random() > 0.975) { drops[i] = 0; }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        function toggleMatrix() {
            matrixActive = !matrixActive;
            const btn = document.getElementById('btn-matrix');
            if (matrixActive) { btn.textContent = 'Matrix: ON'; btn.classList.remove('danger'); btn.classList.add('secondary'); }
            else { ctx.clearRect(0, 0, canvasWidth, canvasHeight); btn.textContent = 'Matrix: OFF'; btn.classList.remove('secondary'); btn.classList.add('danger'); }
        }

        // ==================== VIDEO CHAT CONNECT ====================
        let stream = null;
        let isConnected = false;
        let facingMode = 'environment';

        const video = document.getElementById('chat-video');
        const camStatus = document.getElementById('cam-status');
        const connectInfo = document.getElementById('connect-info');
        const statusText = document.getElementById('status-text');
        const statusDot = document.querySelector('.status-dot');
        const btnConnect = document.getElementById('btn-connect');
        const btnSwitch = document.getElementById('btn-switch-cam');
        const emptyState = document.querySelector('.empty-state');

        function updateUI(connected, camOn) {
            isConnected = connected;
            if (connected) {
                btnConnect.textContent = 'Disconnect';
                btnConnect.classList.remove('danger');
                btnConnect.classList.add('secondary');
                btnSwitch.disabled = false;
                connectInfo.textContent = 'CONNECTED';
                connectInfo.style.color = '#0f0';
                statusText.textContent = 'Connected';
                statusDot.style.background = '#0f0';
                statusDot.style.boxShadow = '0 0 12px #0f0';
                emptyState.style.display = 'none';
                video.style.display = 'block';
                camStatus.textContent = camOn ? 'CAM LIVE' : 'CAM OFF';
                camStatus.style.color = camOn ? '#0f0' : '#f00';
            } else {
                btnConnect.textContent = 'Connect';
                btnConnect.classList.remove('secondary');
                btnConnect.classList.add('danger');
                btnSwitch.disabled = true;
                connectInfo.textContent = 'DISCONNECTED';
                connectInfo.style.color = '#f00';
                statusText.textContent = 'Disconnected';
                statusDot.style.background = '#f00';
                statusDot.style.boxShadow = '0 0 12px #f00';
                emptyState.style.display = 'block';
                video.style.display = 'none';
                camStatus.textContent = 'CAM OFF';
                camStatus.style.color = '#f00';
            }
        }

        async function toggleConnect() {
            if (isConnected) {
                disconnect();
            } else {
                await connect();
            }
        }

        async function connect() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: facingMode }
                });
                video.srcObject = stream;
                updateUI(true, true);
            } catch (err) {
                console.error('Camera error:', err);
                statusText.textContent = 'Camera access denied';
                statusDot.style.background = '#f00';
                statusDot.style.boxShadow = '0 0 12px #f00';
            }
        }

        function disconnect() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            video.srcObject = null;
            updateUI(false, false);
        }

        async function switchCamera() {
            if (!stream) return;
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            const tracks = stream.getVideoTracks();
            tracks.forEach(track => track.stop());
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: facingMode }
                });
                video.srcObject = stream;
            } catch (err) {
                console.error('Switch camera error:', err);
            }
        }

        document.addEventListener('visibilitychange', function() {
            matrixActive = !document.hidden;
        });

        window.addEventListener('DOMContentLoaded', function() {
            updateUI(false, false);
        });
    </script>
</body>
</html>

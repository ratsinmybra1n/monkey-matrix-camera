<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey APP - Matrix Camera</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background-color: #000;
            font-family: 'Courier New', Courier, monospace; color: #0f0;
            height: 100vh; width: 100vw; }
        #matrix-canvas { position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        #camera-container { position: relative; z-index: 10;
            width: 100vw; height: 100vh; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; gap: 20px; }
        #camera-grid { display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px; width: 100%; max-width: 1200px; }
        .camera-card { background: rgba(0, 20, 0, 0.85);
            border: 2px solid #0f0; border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
            overflow: hidden; display: flex; flex-direction: column;
            transition: all 0.3s ease; }
        .camera-card:hover { border-color: #0ff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5); }
        .camera-card h3 { padding: 10px 15px;
            background: rgba(0, 40, 0, 0.9); border-bottom: 1px solid #0f0;
            color: #0f0; font-size: 1rem; text-transform: uppercase;
            letter-spacing: 2px; }
        .camera-wrapper { position: relative; width: 100%;
            aspect-ratio: 16/9; overflow: hidden; background: #000; }
        .camera-wrapper video { width: 100%; height: 100%;
            object-fit: cover; transform: scaleX(-1); }
        .camera-status { position: absolute; top: 10px; right: 10px;
            padding: 5px 10px; background: rgba(0, 0, 0, 0.7);
            border: 1px solid #0f0; color: #0f0; font-size: 0.75rem;
            border-radius: 4px; animation: blink 1s infinite; }
        @keyframes blink { 0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; } }
#controls-panel { position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%); z-index: 100;
    background: rgba(0, 30, 0, 0.95); border: 2px solid #0f0;
    border-radius: 50px; padding: 15px 30px; display: flex; gap: 20px;
    align-items: center; box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
    backdrop-filter: blur(5px); }
    .control-btn { background: transparent; border: 1px solid #0f0;
        color: #0f0; padding: 10px 20px;
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.9rem; cursor: pointer; border-radius: 5px;
        transition: all 0.2s ease; text-transform: uppercase;
        letter-spacing: 1px; }
    .control-btn:hover { background: #0f0; color: #000;
        box-shadow: 0 0 15px #0f0; }
    .control-btn:active { transform: scale(0.95); }
    .control-btn.active { background: #0f0; color: #000; }
    .control-btn.secondary { border-color: #0ff; color: #0ff; }
    .control-btn.secondary:hover { background: #0ff; color: #000; }
    .control-btn.danger { border-color: #f00; color: #f00; }
    .control-btn.danger:hover { background: #f00; color: #000; }
#status-indicator { position: fixed; top: 20px; left: 20px; z-index: 100;
    background: rgba(0, 30, 0, 0.9); border: 1px solid #0f0;
    padding: 10px 15px; border-radius: 5px; font-size: 0.85rem;
    display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; background: #0f0;
        border-radius: 50%; animation: blink 1s infinite;
        box-shadow: 0 0 10px #0f0; }
#header { position: fixed; top: 20px; right: 20px; z-index: 100;
    text-align: right; }
    #header h1 { color: #0f0; font-size: 1.5rem;
        text-transform: uppercase; letter-spacing: 3px;
        text-shadow: 0 0 10px #0f0; margin-bottom: 5px; }
    #header p { color: #0a0; font-size: 0.8rem; letter-spacing: 1px; }
#scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 5; pointer-events: none;
    background: linear-gradient(to bottom,
        rgba(255,255,255,0), rgba(255,255,255,0) 50%,
        rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
    background-size: 100% 4px; }
#vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 5; pointer-events: none;
    background: radial-gradient(circle, transparent 60%, rgba(0, 0, 0, 0.8) 100%); }
@keyframes crt-flicker { 0% { opacity: 0.97; }
    50% { opacity: 1; } 100% { opacity: 0.98; } }
#crt-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 6; background: rgba(0, 0, 0, 0.1);
    animation: crt-flicker 0.15s infinite; pointer-events: none; }
@media (max-width: 768px) {
    #camera-grid { grid-template-columns: 1fr; max-width: 400px; }
    #controls-panel { bottom: 10px; padding: 10px 20px; gap: 10px; }
    .control-btn { padding: 8px 15px; font-size: 0.8rem; }
    #header { top: 10px; right: 10px; }
    #header h1 { font-size: 1.2rem; }
}
</style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>
    <div id="scanlines"></div>
    <div id="vignette"></div>
    <div id="crt-overlay"></div>

    <div id="header">
        <h1>Monkey APP</h1>
        <p>Matrix Camera Interface</p>
    </div>

    <div id="status-indicator">
        <div class="status-dot"></div>
        <span id="status-text">System Ready</span>
    </div>

    <div id="camera-container">
        <div id="camera-grid"></div>
    </div>

    <div id="controls-panel">
        <button class="control-btn" id="btn-add-camera" onclick="addCamera()">Add Camera</button>
        <button class="control-btn secondary" id="btn-toggle-matrix" onclick="toggleMatrix()">Matrix: ON</button>
        <button class="control-btn danger" id="btn-stop-all" onclick="stopAllCameras()">Stop All</button>
        <button class="control-btn" id="btn-screenshot" onclick="takeScreenshot()">Screenshot</button>
    </div>

    <script>
        // ==================== MATRIX BACKGROUND ====================
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        let canvasWidth, canvasHeight, fontSize = 14, columns, drops = [];
        let matrixActive = true;
        const matrixChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%+-/~{[|`]}";

        function resizeCanvas() {
            canvasWidth = canvas.width = window.innerWidth;
            canvasHeight = canvas.height = window.innerHeight;
            columns = canvasWidth / fontSize;
            drops = [];
            for (let i = 0; i < columns; i++) { drops[i] = Math.random() * canvasHeight / fontSize; }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawMatrix() {
            if (!matrixActive) return;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            ctx.fillStyle = '#0f0';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = matrixChars.charAt(Math.floor(Math.random() * matrixChars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvasHeight && Math.random() > 0.975) { drops[i] = 0; }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        function toggleMatrix() {
            matrixActive = !matrixActive;
            const btn = document.getElementById('btn-toggle-matrix');
            if (matrixActive) { btn.textContent = 'Matrix: ON'; btn.classList.remove('danger'); btn.classList.add('secondary'); }
            else { ctx.clearRect(0, 0, canvasWidth, canvasHeight); btn.textContent = 'Matrix: OFF'; btn.classList.remove('secondary'); btn.classList.add('danger'); }
        }

        // ==================== CAMERA FUNCTIONALITY ====================
        let cameras = [], nextCameraId = 1;

        async function initCamera(cardElement, videoElement, id) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'environment' }
                });
                videoElement.srcObject = stream;
                cameras[id - 1] = { stream, id, active: true };
                const statusElem = cardElement.querySelector('.camera-status');
                statusElem.textContent = 'LIVE'; statusElem.style.color = '#0f0';
                updateStatusText('Camera ' + id + ' active');
            } catch (err) {
                console.error('Error accessing camera:', err);
                const statusElem = cardElement.querySelector('.camera-status');
                statusElem.textContent = 'ERROR'; statusElem.style.color = '#f00';
                updateStatusText('Camera ' + id + ' error: ' + err.message, true);
            }
        }

        function createCameraCard(id) {
            const card = document.createElement('div');
            card.className = 'camera-card'; card.id = 'camera-card-' + id;
            card.innerHTML = '<h3>CAM-' + id.toString().padStart(2, '0') + '</h3>' +
                '<div class="camera-wrapper">' +
                '<video id="video-' + id + '" autoplay playsinline muted></video>' +
                '<div class="camera-status" id="status-' + id + '">INIT</div>' +
                '</div>';
            return card;
        }

        async function addCamera() {
            if (cameras.length >= 6) { updateStatusText('Maximum cameras reached (6)', true); return; }
            const id = nextCameraId++;
            const cameraGrid = document.getElementById('camera-grid');
            const card = createCameraCard(id);
            cameraGrid.appendChild(card);
            const video = document.getElementById('video-' + id);
            await initCamera(card, video, id);
            updateStatusText('Added camera ' + id);
        }

        async function stopAllCameras() {
            cameras.forEach(function(cam) {
                if (cam.stream) { cam.stream.getTracks().forEach(function(track) { track.stop(); }); }
                const video = document.getElementById('video-' + cam.id);
                if (video) { video.srcObject = null; }
                const statusElem = document.getElementById('status-' + cam.id);
                if (statusElem) { statusElem.textContent = 'OFF'; statusElem.style.color = '#f00'; }
            });
            cameras = []; document.getElementById('camera-grid').innerHTML = ''; nextCameraId = 1;
            updateStatusText('All cameras stopped');
        }

        async function takeScreenshot() {
            const activeCams = cameras.filter(function(c) { return c.active; });
            if (activeCams.length === 0) { updateStatusText('No active cameras to capture', true); return; }
            activeCams.forEach(function(cam) {
                const video = document.getElementById('video-' + cam.id);
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640; canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d'); ctx.drawImage(video, 0, 0);
                const link = document.createElement('a');
                link.download = 'monkey-camera-' + cam.id + '-' + Date.now() + '.png';
                link.href = canvas.toDataURL('image/png'); link.click();
            });
            updateStatusText('Captured ' + activeCams.length + ' screenshot(s)');
        }

        function updateStatusText(text, isError) {
            const statusText = document.getElementById('status-text');
            const statusDot = document.querySelector('.status-dot');
            statusText.textContent = text;
            if (isError) { statusDot.style.background = '#f00'; statusDot.style.boxShadow = '0 0 10px #f00'; }
            else { statusDot.style.background = '#0f0'; statusDot.style.boxShadow = '0 0 10px #0f0'; }
        }

        window.addEventListener('DOMContentLoaded', async function() {
            updateStatusText('Initializing...');
            try { await addCamera(); } catch (err) {
                updateStatusText('Camera access denied - click Add Camera to retry', true);
            }
        });

        document.addEventListener('visibilitychange', function() {
            matrixActive = !document.hidden;
        });
    </script>
</body>
</html>
